<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Fatecie Seguro AI</title>
  <desc id="desc">Escudo laranja com símbolo de inteligência artificial.</desc>

  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Escudo -->
  <path
    d="M32 3.5 54 11v17.5c0 14.1-8.5 25.9-22 32C18.5 54.4 10 42.6 10 28.5V11L32 3.5Z"
    fill="url(#shield)"
  />

  <!-- Contorno interno do escudo -->
  <path
    d="M32 9 48.5 14.6v13c0 10.9-6.1 20.2-16.5 26-10.4-5.8-16.5-15.1-16.5-26v-13L32 9Z"
    fill="none"
    stroke="#fff"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Circuitos -->
  <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 25h-5v-4"/>
    <path d="M42 25h5v-4"/>
    <path d="M22 39h-5v4"/>
    <path d="M42 39h5v4"/>
    <path d="M32 20v-5"/>
    <path d="M32 44v5"/>
  </g>

  <!-- Terminais -->
  <g fill="#fff">
    <circle cx="17" cy="20" r="2.2"/>
    <circle cx="47" cy="20" r="2.2"/>
    <circle cx="17" cy="44" r="2.2"/>
    <circle cx="47" cy="44" r="2.2"/>
    <circle cx="32" cy="15" r="2.2"/>
    <circle cx="32" cy="49" r="2.2"/>
  </g>

  <!-- Chip -->
  <rect x="21" y="20" width="22" height="24" rx="5" fill="#fff"/>
  <rect x="24.5" y="23.5" width="15" height="17" rx="2.5" fill="#ea580c"/>

  <!-- AI -->
  <text
    x="32"
    y="36.3"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8.5"
    font-weight="700"
    fill="#fff"
  >AI</text>
</svg>
